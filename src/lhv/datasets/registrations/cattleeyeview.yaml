# Dataset registration: CattleEyeView.
#
# Primary perception source. The only public candidate carrying keypoints, and
# therefore the only one able to exercise gait phenotype.
#
# Every figure under "counts" is what the paper reports. None of it is evidence
# until `lhv datasets verify` counts the same thing on disk.

name: cattleeyeview
version: "2023.1"
description: >
  Top-down multi-task cattle video dataset. 14 video sequences from overhead RGB
  CCTV fixed at 3.7 m over the outdoor loading ramp of a single farm, recorded
  morning and evening between 2021-11-09 and 2022-03-04. Annotations: body and
  head bounding boxes, tracking identifiers, cattle count, 24 keypoints with a
  visible/occluded tag, and instance segmentation masks.

# One farm, one loading ramp. Recorded as a single site so that a site-disjoint
# split over this source alone is correctly impossible rather than quietly wrong.
site_key: cev-farm-01

# The paper says "overhead RGB CCTV cameras" without giving a count, and the
# release files the 14 sequences flat as videos/01.mp4 .. 14.mp4 with no camera
# in the path. One ramp view is therefore the only claim the release supports.
camera_ids:
  - cev-ramp-overhead

animal_set_keys:
  - cev-ramp-herd

access:
  licence: Apache-2.0
  licence_url: https://github.com/AnimalEyeQ/CattleEyeView/blob/main/LICENSE
  access_route: request-form
  request_url: https://forms.gle/KGf3dmEjPX9qwVz49
  download_url: "https://drive.google.com/drive/folders/1Pjt1bEZR5s-grzMqnuOEpIv9A7JK1VoL"
  commercial_use: >
    The repository carries Apache-2.0, which covers the released code. The
    dataset itself is distributed only through the request form, and the terms
    attached to the delivered material must be read on receipt and recorded
    here. Do not assume the code licence extends to the video. The delivered
    README states only a citation requirement.
  attribution: >
    Kian Eng Ong, Sivaji Retta, Ramarajulu Srinivasan, Shawn Tan, Jun Liu.
    Singapore University of Technology and Design; AnimalEYEQ Private Limited.
  citation: >
    Ong et al. CattleEyeView: A Multi-task Top-down View Cattle Dataset for
    Smarter Precision Livestock Farming. IEEE VCIP 2023.
    doi:10.1109/VCIP59821.2023.10402676 — arXiv:2312.08764
  recorded_on: "2026-09-04"
  notes: >
    Access requires submitting the authors' Google Form and awaiting approval;
    approval yields a Google Drive folder. That step cannot be automated — it
    needs a named requester and an affiliation. The Drive folder is also subject
    to Google's per-day anonymous download quota, which a heavily shared folder
    reaches quickly. When it does, every file returns an HTTP 200 carrying an
    HTML "Quota exceeded" page rather than an error status, so a downloader that
    does not inspect the body will write the interstitial to disk under the
    file's name. Copying the folder into an account's own Drive gives it a fresh
    quota. Questions: rama@animaleyeq.com, kianeng_ong@mymail.sutd.edu.sg.

# Structure below is read from the delivered Drive folder and the release's own
# cattleeyeview_pose.yaml, not from the paper:
#
#   videos/01.mp4 .. 14.mp4              the 14 original sequences
#   images.tar.gz                        the full extracted frame set (COCO/mmpose),
#                                        laid out as images/<sequence>.mp4/<frame>.jpg
#   annotation/detect/{images,labels}    YOLO detection, images split train/test/val
#   annotation/detect_head/labels        YOLO head detection
#   annotation/pose/labels               YOLO pose, 24 keypoints, frames 1920x1080
#   annotation/pose_COCO/coco_track_{train,test}.json   COCO pose with track ids
#   annotation/segment/labels            YOLO segmentation
#   annotation/metadata and count.xlsx   per-sequence metadata and counts
#
# The detect folder alone carries the YOLO image subset; the other YOLO tasks
# reuse it. images.tar.gz is a different, fuller set used by the COCO format.
layouts:
  # The original sequences. The release puts no recording date in any path, but
  # every frame carries one burned into the top-right overlay by the camera.
  # The values below were read from frame 0 of each sequence.
  #
  # Two independent checks that they are right: sequence 01 is 2021-11-09 and
  # sequence 14 is 2022-03-04, which are exactly the collection start and end
  # the paper states; and the dates increase monotonically with the sequence
  # number. Sequences 08 and 09 share a day, so 14 sequences span 13 distinct
  # days, and a day-disjoint split over this source is a real one.
  #
  # The overlay shows local farm time at an offset the release does not state.
  # It is recorded here as UTC. That is wrong in absolute terms by whatever the
  # farm's offset is, and right for everything this pipeline does with it —
  # ordering within a sequence, grouping into days, and the spacing between
  # observations in a baseline. It would matter if these were ever aligned
  # against an external event stream, which P0 has none of.
  footage:
    kind: video
    path: "videos/{sequence}.mp4"
    group_by: [sequence]
    start_timestamps:
      "01": "2021-11-09T07:32:26"
      "02": "2021-11-10T06:10:18"
      "03": "2021-11-11T05:43:01"
      "04": "2021-11-14T06:25:31"
      "05": "2021-11-17T06:43:10"
      "06": "2021-12-07T17:10:54"
      "07": "2021-12-14T06:07:02"
      "08": "2021-12-19T06:32:34"
      "09": "2021-12-19T07:02:00"
      "10": "2021-12-29T10:00:27"
      "11": "2022-01-06T06:20:52"
      "12": "2022-02-16T06:23:05"
      "13": "2022-02-23T06:34:19"
      "14": "2022-03-04T06:01:02"

  # The extracted frames, for when the archive is unpacked. It usually need not
  # be: the member path names the sequence and the frame, so an annotation that
  # references images/03.mp4/00871.jpg resolves to sequence 03, video frame 870,
  # which ingest can decode with real provenance attached. Loose frames carry no
  # clock; the video does.
  #
  # The frame number is ONE-BASED against a zero-based video index. Verified by
  # decoding: images/01.mp4/00116.jpg matches video frame 115 at a mean absolute
  # difference of 3.4, against 7.5 or worse for either neighbour.
  frames:
    kind: image_sequence
    path: "images/{sequence}.mp4/{frame}.jpg"
    group_by: [sequence]
    order_by: frame

media_extensions: [".mp4", ".avi", ".jpg", ".png"]

# Declared by the literature. Verified against the download, never before.
counts:
  sequences:
    kind: files
    glob: "videos/*.mp4"
    declared: 14
    note: "14 video sequences"
  # The release ships both the original videos and an extracted frame set. The
  # paper's 30,703 is one number; these are two independent ways of checking it,
  # and they are not required to agree with each other, only to be reported.
  frames_in_videos:
    kind: video_frames
    glob: "videos/*.mp4"
    declared: 30706
    note: >
      Frames decodable from the 14 original sequences. Unlike the other figures
      here this one is not from the paper — it was measured, and is recorded so
      that it becomes a regression check. It exceeds the paper's 30,703 by
      exactly three: the final frame of sequences 03, 05 and 06 is absent from
      the extracted set and present in the video. Every other sequence agrees
      frame for frame.
  frames:
    kind: archive_members
    archive: images.tar.gz
    glob: "images/*.mp4/*.jpg"
    declared: 30703
    note: >
      30,703 extracted frames, per the paper. Counted inside images.tar.gz
      without unpacking it: the archive is 12 GB and unpacking it buys nothing,
      because every member is a frame of a video already on disk. The YOLO
      subset under annotation/detect/images is a different and smaller set, and
      is deliberately not what this counts.

limitations:
  - "Single site, so a site-disjoint split cannot be exercised from this source alone."
  - "753 distinct cow instances are annotation instances, not 753 identified individuals followed longitudinally."
  - "No clinical labels of any kind. Nothing in this source can validate a health inference."
  - "Recorded over 4 months at one ramp. The release carries no recording date in any path, but the camera burns one into every frame; those were read and are declared in the footage layout, so day-disjoint splits over 13 distinct days are real rather than a sequence-shaped proxy."
  - "Frames are 1920x1080 and the detection class is 'cow'; pose labels are YOLO format with 24 keypoints, per the release's own cattleeyeview_pose.yaml."
  - "Frame rate varies by sequence and is not stated in the paper: 8 fps for 01-06, 3 fps for 07-11, 5 fps for 12-14. Any per-second feature is therefore only as resolvable as the sequence it came from, and the 3 fps sequences cannot resolve a stride at all."
  - "The 14 sequences decode to 30,706 frames while images.tar.gz holds exactly the 30,703 the paper reports. The difference is located, not merely noted: sequences 03, 05 and 06 are each missing their final frame from the extracted set, and every other sequence matches exactly. Both figures are correct and measure different things."
