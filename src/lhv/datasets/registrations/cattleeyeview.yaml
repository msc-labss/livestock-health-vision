# Dataset registration: CattleEyeView.
#
# Primary perception source. The only public candidate carrying keypoints, and
# therefore the only one able to exercise gait phenotype.
#
# Every figure under "counts" is what the paper reports. None of it is evidence
# until `lhv datasets verify` counts the same thing on disk.

name: cattleeyeview
version: "2023.1"
description: >
  Top-down multi-task cattle video dataset. 14 video sequences from overhead RGB
  CCTV fixed at 3.7 m over the outdoor loading ramp of a single farm, recorded
  morning and evening between 2021-11-09 and 2022-03-04. Annotations: body and
  head bounding boxes, tracking identifiers, cattle count, 24 keypoints with a
  visible/occluded tag, and instance segmentation masks.

# One farm, one loading ramp. Recorded as a single site so that a site-disjoint
# split over this source alone is correctly impossible rather than quietly wrong.
site_key: cev-farm-01

# The paper says "overhead RGB CCTV cameras" without giving a count, and the
# release files the 14 sequences flat as videos/01.mp4 .. 14.mp4 with no camera
# in the path. One ramp view is therefore the only claim the release supports.
camera_ids:
  - cev-ramp-overhead

animal_set_keys:
  - cev-ramp-herd

access:
  licence: Apache-2.0
  licence_url: https://github.com/AnimalEyeQ/CattleEyeView/blob/main/LICENSE
  access_route: request-form
  request_url: https://forms.gle/KGf3dmEjPX9qwVz49
  download_url: "https://drive.google.com/drive/folders/1Pjt1bEZR5s-grzMqnuOEpIv9A7JK1VoL"
  commercial_use: >
    The repository carries Apache-2.0, which covers the released code. The
    dataset itself is distributed only through the request form, and the terms
    attached to the delivered material must be read on receipt and recorded
    here. Do not assume the code licence extends to the video. The delivered
    README states only a citation requirement.
  attribution: >
    Kian Eng Ong, Sivaji Retta, Ramarajulu Srinivasan, Shawn Tan, Jun Liu.
    Singapore University of Technology and Design; AnimalEYEQ Private Limited.
  citation: >
    Ong et al. CattleEyeView: A Multi-task Top-down View Cattle Dataset for
    Smarter Precision Livestock Farming. IEEE VCIP 2023.
    doi:10.1109/VCIP59821.2023.10402676 — arXiv:2312.08764
  recorded_on: "2026-09-04"
  notes: >
    Access requires submitting the authors' Google Form and awaiting approval;
    approval yields a Google Drive folder. That step cannot be automated — it
    needs a named requester and an affiliation. The Drive folder is also subject
    to Google's per-day anonymous download quota, which a heavily shared folder
    reaches quickly. When it does, every file returns an HTTP 200 carrying an
    HTML "Quota exceeded" page rather than an error status, so a downloader that
    does not inspect the body will write the interstitial to disk under the
    file's name. Copying the folder into an account's own Drive gives it a fresh
    quota. Questions: rama@animaleyeq.com, kianeng_ong@mymail.sutd.edu.sg.

# Structure below is read from the delivered Drive folder and the release's own
# cattleeyeview_pose.yaml, not from the paper:
#
#   videos/01.mp4 .. 14.mp4              the 14 original sequences
#   images.tar.gz                        the full extracted frame set (COCO/mmpose)
#   annotation/detect/{images,labels}    YOLO detection, images split train/test/val
#   annotation/detect_head/labels        YOLO head detection
#   annotation/pose/labels               YOLO pose, 24 keypoints, frames 1920x1080
#   annotation/pose_COCO/coco_track_{train,test}.json   COCO pose with track ids
#   annotation/segment/labels            YOLO segmentation
#   annotation/metadata and count.xlsx   per-sequence metadata and counts
#
# The detect folder alone carries the YOLO image subset; the other YOLO tasks
# reuse it. images.tar.gz is a different, fuller set used by the COCO format.
layouts:
  # The original sequences. The release files them flat with no recording date
  # in the path, and the per-sequence dates live in the metadata spreadsheet,
  # which has not been read. The sequence therefore stands in as the day key,
  # which makes a day-disjoint split a sequence-disjoint split. That is a weaker
  # guarantee than a true day split, and is recorded as such rather than
  # presented as one.
  footage:
    kind: video
    path: "videos/{sequence}.mp4"
    group_by: [sequence]
    day_field: sequence

media_extensions: [".mp4", ".avi", ".jpg", ".png"]

# Declared by the literature. Verified against the download, never before.
counts:
  sequences:
    kind: files
    glob: "videos/*.mp4"
    declared: 14
    note: "14 video sequences"
  frames:
    kind: files
    glob: "images/**/*.jpg"
    declared: 30703
    note: >
      30,703 annotated frames, per the paper. Counted from the unpacked
      images.tar.gz, which the release describes as the full extracted frame
      set. The YOLO subset under annotation/detect/images is a different and
      smaller set, and is deliberately not what this counts.

limitations:
  - "Single site, so a site-disjoint split cannot be exercised from this source alone."
  - "753 distinct cow instances are annotation instances, not 753 identified individuals followed longitudinally."
  - "No clinical labels of any kind. Nothing in this source can validate a health inference."
  - "Recorded over 4 months at one ramp; day-disjoint splits are possible in principle, but the release carries no recording date in any path, so a sequence stands in for a day until the metadata spreadsheet is read."
  - "Frames are 1920x1080 and the detection class is 'cow'; pose labels are YOLO format with 24 keypoints, per the release's own cattleeyeview_pose.yaml."
