# Species profile: dairy cattle.
#
# This file is the species seam. Adding a species means adding a sibling of this
# file, not editing any stage. Every value below is species-specific by
# definition; nothing species-specific belongs anywhere else in the package.

species: cattle
version: "1"
# The profile used when a caller names none. Declared here because more than one
# profile is now installed, so "the only one present" no longer identifies it.
default: true

notes: >
  Version 1 retires the CattleEyeView inheritance. The skeleton and feature set
  no longer follow the only public source that carried cattle keypoints, because
  that source is top-down and P0 measured what that costs: paw keypoints are
  labelled visible in 4.5-9.1% of instances, since the body occludes its own
  limbs from above. The feature set now follows published discrimination and the
  skeleton follows the feature set. Six of nine features are declared but not yet
  computable and say why; three compute today. See docs/P1-MODEL-DECISION.md for
  the evidence behind each choice and docs/P1-LITERATURE-FINDINGS.md for which
  of that evidence was verified.

skeleton:
  # PROVISIONAL, but no longer unmoored. The count question this file was
  # written under is settled: Russello et al. 2022 (arXiv:2104.08029) states
  # that CoWalk annotates seventeen landmarks — hoof, fetlock and carpal per
  # forelimb; hoof, fetlock and tarsal per hind limb; and nose, forehead,
  # withers, caudal thoracic vertebrae, sacrum. The nine in their 2024 lameness
  # paper are a subset of those seventeen.
  #
  # The five body points below are exactly CoWalk's five, chosen here before the
  # count was known: mid_thoracic is their caudal thoracic vertebrae under a
  # plainer name. So this skeleton is CoWalk-17 with the eight intermediate limb
  # joints removed, and they are removed because no feature in version 1 depends
  # on one — not because they are unknown.
  #
  # Still provisional for one reason only: whether those eight intermediate
  # joints carry lameness information this feature set is missing is a question
  # the pilot recording answers, not the literature.
  identifier: lateral-gait-9
  version: "0"
  provisional: true
  view: lateral
  source: >
    A subset of the CoWalk convention of Russello, van der Tol, Holzhauer, van
    Henten & Kootstra, T-LEAP: occlusion-robust pose estimation of walking cows
    using temporal information, Computers and Electronics in Agriculture 192
    (2022), doi:10.1016/j.compag.2021.106559, arXiv:2104.08029. CoWalk annotates
    seventeen landmarks; this profile carries its five body points verbatim in
    meaning — nose, forehead, withers, caudal thoracic vertebrae (named
    mid_thoracic here), sacrum — plus the four hooves, and omits the eight
    intermediate limb joints because no feature in version 1 depends on one.
    Adopting the full seventeen is a rename plus eight additions, not a
    re-labelling.
  # The two keypoints that define the body axis. Declared here so that
  # feature extraction never has to name a keypoint of its own.
  roles:
    body_axis_cranial: withers
    body_axis_caudal: sacrum
  keypoints:
    - { name: nose, index: 0, description: "muzzle tip; the head reference for vertical oscillation" }
    - { name: forehead, index: 1, description: "poll, between the ears; second head point for pitch" }
    - { name: withers, index: 2, description: "cranial end of the dorsal line" }
    - { name: mid_thoracic, index: 3, description: "mid-back; the sag/arch point of the dorsal line" }
    - { name: sacrum, index: 4, description: "caudal end of the dorsal line" }
    - { name: left_front_hoof, index: 5, swap: right_front_hoof }
    - { name: right_front_hoof, index: 6, swap: left_front_hoof }
    - { name: left_hind_hoof, index: 7, swap: right_hind_hoof }
    - { name: right_hind_hoof, index: 8, swap: left_hind_hoof }
  # No OKS sigmas are recorded. The CattleEyeView sigmas this profile previously
  # carried were taken verbatim from that release; no published sigma exists for
  # this point set, and inventing one would put a number with no provenance into
  # every keypoint metric. Absent means absent: sigma defaults to zero and any
  # OKS computed from it is meaningless rather than plausibly wrong.
  sigma_source: none-established
  # Descriptive only — no feature is computed from a link.
  links:
    - [nose, forehead]
    - [forehead, withers]
    - [withers, mid_thoracic]
    - [mid_thoracic, sacrum]
    - [withers, left_front_hoof]
    - [withers, right_front_hoof]
    - [sacrum, left_hind_hoof]
    - [sacrum, right_hind_hoof]

weights:
  detector:
    name: yolo11m
    version: "8.4"
    uri: "https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11m.pt"
    licence: AGPL-3.0
    licence_url: "https://github.com/ultralytics/ultralytics/blob/main/LICENSE"
    commercial_use: "requires an Ultralytics enterprise licence"
    target_classes: [cow]
    notes: >
      COCO-pretrained; the 'cow' class is used as the animal class. Detection of
      cattle from a top-down view is out of COCO's training distribution, so
      detection metrics are reported against CattleEyeView labels rather than
      assumed.
  pose:
    name: hrnet-w32-ap10k
    version: "20211029"
    uri: "https://download.openmmlab.com/mmpose/animal/hrnet/hrnet_w32_ap10k_256x256-18aac840_20211029.pth"
    licence: CC-BY-4.0
    licence_url: "https://github.com/AlexTheBad/AP-10K/blob/main/LICENSE"
    commercial_use: "permitted with attribution"
    native_skeleton: ap10k-17
    # These are mmpose HRNet weights, which the Ultralytics loader cannot read.
    # Declared so the pipeline refuses to build a pose backend by name instead of
    # handing the file to a loader that cannot parse it. Implementing this
    # runtime belongs with the pilot recording: there is no lateral cattle
    # footage here to exercise it against.
    runtime: mmpose
    not_wired: >-
      the mmpose runtime cannot be installed on this project's Python. mmcv does
      not support 3.12, let alone the 3.13 here, and has an open defect building
      against torch 2.9 with CUDA 13 while this environment runs torch 2.14 on
      CUDA 13.0. This is not deferred work waiting on footage; the runtime is
      unavailable, and reaching AP-10K's convention needs a different one. See
      docs/P1-MODEL-DECISION.md.
    placeholder: true
    placeholder_reason: >-
      trained on AP-10K's 54-species natural imagery, not on cattle walking a
      lane, and against AP-10K's own 17-point convention rather than this
      skeleton
    # AP-10K's distal limb ends at the paw, which is what every temporal and
    # stride feature needs; the intermediate joints it lacks were only ever
    # required by a skeleton chosen before the features were.
    #
    # Two mappings below are positional approximations rather than identities,
    # and are named as such. AP-10K's 'neck' is annotated at the base of the
    # neck, which in a lateral projection sits at the withers; its 'root of
    # tail' sits at the sacrum. Neither is the biped-to-quadruped analogy this
    # profile previously carried — a human wrist is not a front paw, whereas a
    # quadruped's root of tail genuinely is at its sacrum.
    #
    # 'forehead' and 'mid_thoracic' have no AP-10K equivalent and are emitted
    # not-visible. mid_thoracic is why back_posture is declared unavailable:
    # sagittal arch needs three points along the dorsal line and this backend
    # supplies two.
    keypoint_map:
      nose: nose
      neck: withers
      root_of_tail: sacrum
      left_front_paw: left_front_hoof
      right_front_paw: right_front_hoof
      left_back_paw: left_hind_hoof
      right_back_paw: right_hind_hoof
    notes: >
      Bootstrap, not a cattle model. AP-10K's dataset is CC-BY-4.0 (verified
      against the repository's own LICENSE file) and mmpose, which trains and
      hosts the checkpoints, is Apache-2.0. No checkpoint-specific licence
      statement exists, so the conservative reading is that CC-BY-4.0
      attribution flows through from the training data; both licences permit
      commercial use with attribution, which is less restrictive than the
      AGPL-3.0 weights this replaces. Zero-shot accuracy on lateral cattle
      footage is unknown and is measured by the pilot recording, not asserted
      here. Substituting a cattle-trained checkpoint is a change to this file
      alone.
  reid:
    name: torchvision-resnet50
    version: "IMAGENET1K_V2"
    uri: "torchvision://resnet50"
    licence: BSD-3-Clause
    licence_url: "https://github.com/pytorch/vision/blob/main/LICENSE"
    commercial_use: permitted
    runtime: torchvision
    not_wired: >-
      no stage builds an embedding from this reference; the fallback runs a
      weights-free colour histogram and these are the intended upgrade
    notes: >
      The intended upgrade for the visual re-identification fallback, not what
      currently runs. The fallback uses a weights-free colour-histogram
      embedding, and the re-identification figures P0 reports were produced by
      that histogram rather than by these weights. Recorded because P0's finding
      is that a stronger embedding would raise the accuracy while leaving the
      architectural conclusion unchanged — so the upgrade is a decision worth
      writing down, and pretending it is already in place is not.

feature_set:
  version: "1"
  rationale: >
    Chosen for published discrimination, not for computability from whichever
    skeleton was available. Support-phase asymmetry leads because Kang et al.
    2020 measured it against locomotion score at Spearman 0.864 over 100 cows on
    a commercial parlour-entrance lane; the stance, swing and stride timings and
    the length and posture traits follow Russello et al. 2024, which reached
    80.1% over 98 cows using six of them together. Six of the nine are declared
    but not yet computable, each naming what is missing rather than being
    omitted: five need hoof ground-contact detection, which has no
    implementation here and no lateral footage to tune against, and back_posture
    needs a mid-dorsal keypoint the current backend does not emit. Four of the
    nine are times, so they need a frame rate and no camera calibration at all.
  features:
    # -- computable now ------------------------------------------------------
    - name: speed
      unit: body_lengths_per_second
      view: lateral
      description: "Median progression speed of the dorsal line's midpoint along the lane."
      depends_on: [withers, sacrum]
      higher_is_worse: false
    - name: stride_length
      unit: body_lengths
      view: lateral
      description: "Mean along-axis excursion of a hoof between successive placements."
      depends_on: [left_front_hoof, right_front_hoof, left_hind_hoof, right_hind_hoof, withers, sacrum]
      higher_is_worse: false
    - name: head_bob
      unit: body_lengths
      view: lateral
      description: >
        Amplitude of vertical head oscillation over the pass, perpendicular to
        the direction of travel in the sagittal plane. The quantity a human
        scorer reads as head bobbing.
      depends_on: [nose, withers, sacrum]
      higher_is_worse: true

    # -- declared, not yet computable ----------------------------------------
    - name: back_posture
      unit: body_lengths
      view: lateral
      description: >
        Sagittal deviation of the mid-back from the line joining withers and
        sacrum. Positive is arched.
      depends_on: [withers, mid_thoracic, sacrum]
      higher_is_worse: true
      available: false
      unavailable_reason: >-
        needs the mid_thoracic keypoint; sagittal arch is measured from three
        points along the dorsal line and the AP-10K backend emits two
    - name: support_phase_asymmetry
      unit: seconds
      view: lateral
      description: >
        Difference between the longest and shortest supporting phase across the
        four hooves over a pass. The strongest single published discriminator.
      depends_on: [left_front_hoof, right_front_hoof, left_hind_hoof, right_hind_hoof]
      higher_is_worse: true
      available: false
      unavailable_reason: "needs hoof ground-contact detection, which is not implemented"
    - name: stance_duration
      unit: seconds
      view: lateral
      description: "Mean time a hoof is in contact with the ground per stride."
      depends_on: [left_front_hoof, right_front_hoof, left_hind_hoof, right_hind_hoof]
      higher_is_worse: true
      available: false
      unavailable_reason: "needs hoof ground-contact detection, which is not implemented"
    - name: swing_duration
      unit: seconds
      view: lateral
      description: "Mean time a hoof is off the ground per stride."
      depends_on: [left_front_hoof, right_front_hoof, left_hind_hoof, right_hind_hoof]
      higher_is_worse: false
      available: false
      unavailable_reason: "needs hoof ground-contact detection, which is not implemented"
    - name: stride_duration
      unit: seconds
      view: lateral
      description: >
        Time for one hoof to complete a full stride cycle. Replaces the stride
        frequency of feature-set version 0: the same information, expressed as
        the quantity the literature measures and the one priors exist for.
      depends_on: [left_front_hoof, right_front_hoof, left_hind_hoof, right_hind_hoof]
      higher_is_worse: true
      available: false
      unavailable_reason: "needs hoof ground-contact detection, which is not implemented"
    - name: tracking_distance
      unit: body_lengths
      view: lateral
      description: >
        Signed distance between a hind hoof's placement and the fore hoof print
        it lands relative to. What clinicians read as tracking-up.
      depends_on: [left_front_hoof, right_front_hoof, left_hind_hoof, right_hind_hoof]
      higher_is_worse: true
      available: false
      unavailable_reason: "needs hoof ground-contact detection, which is not implemented"

priors:
  # Bands remain unvalidated: this project has no measurement of how far a
  # population spreads on any of these. What is new is the anchors below, which
  # are measured rather than guessed.
  speed:                   { low: 0.20, high: 2.50, source: unvalidated-p0-prior }
  stride_length:           { low: 0.10, high: 1.20, source: unvalidated-p0-prior }
  head_bob:                { low: 0.00, high: 0.40, source: unvalidated-p0-prior }
  back_posture:            { low: 0.00, high: 0.20, source: unvalidated-p0-prior }
  stance_duration:         { low: 0.30, high: 1.50, source: unvalidated-p0-prior }
  swing_duration:          { low: 0.20, high: 1.00, source: unvalidated-p0-prior }
  stride_duration:         { low: 0.60, high: 2.50, source: unvalidated-p0-prior }
  support_phase_asymmetry: { low: 0.00, high: 0.50, source: unvalidated-p0-prior }
  tracking_distance:       { low: -0.50, high: 0.50, source: unvalidated-p0-prior }

# Measured central values, with the direction lameness moves them. NOT ranges:
# these are group means with standard errors from Flower, Sanderson & Weary
# 2005 (J Dairy Sci; healthy n=17, sole lesion n=14, sole ulcer n=7), and a mean
# plus or minus three hundredths of a second describes where a group sat, not
# how far a population spreads. Recording one as a low/high band would produce a
# plausibility check that rejects most normal animals.
#
# Two of the four are in metres and this project has no camera calibration, so
# they inform a direction and cannot become a threshold.
anchors:
  stride_duration:
    healthy: 1.26
    unit: seconds
    direction: longer
    lame_observed: 1.48
    source: flower-2005-group-mean
  stance_duration:
    healthy: 0.69
    unit: seconds
    direction: longer
    lame_observed: 0.91
    source: flower-2005-group-mean
  speed:
    healthy: 1.11
    unit: metres_per_second
    direction: slower
    lame_observed: 0.90
    source: flower-2005-group-mean
    calibration_required: true
  support_phase_asymmetry:
    healthy: 0.057
    unit: seconds
    direction: larger
    lame_observed: 0.394
    source: kang-2020-group-mean
    # Mean difference between a cow's longest and shortest supporting phase, by
    # locomotion score: 0.057 s sound, 0.183 s mild, 0.394 s severe, over 100
    # cows on a commercial parlour approach. The first measured value for the
    # feature the literature ranks highest, which until now carried only a guess.
    # Note the reference was a three-point scale, deliberately coarsened by its
    # authors to make the scoring more reliable — not Sprecher 1-5.
  stride_length:
    healthy: 1.395
    unit: metres
    direction: shorter
    lame_observed: 1.300
    source: flower-2005-group-mean
    calibration_required: true

scoring_scale:
  name: sprecher-locomotion-score
  minimum: 1
  maximum: 5
  step: 1
  reference: >
    Sprecher, Hostetler, Kaneene. A lameness scoring system that uses posture and
    gait to predict dairy cattle reproductive performance. Theriogenology
    47(6):1179-1187, 1997. Recorded for the downstream clinical decision layer;
    P0 produces no score on this scale.
